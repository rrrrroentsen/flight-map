<style>
:root{
  color-scheme: light;
  --page:#F2F5F4; --surface:#FFFFFF; --sea:#D7E3EA; --land:#FAF9F4; --coast:#9BB1BE; --border:#DDE2DF; --grat:#C5D5DE;
  --ink:#13222D; --ink2:#4B5F6E; --ink3:#8296A3; --rule:#D2DCE1;
  --hot:#C4177C; --cool:#1D5FAE; --danger:#B3261E; --scrim:rgba(19,34,45,.42);
  --num:"DIN Alternate","Roboto Condensed","Arial Narrow","Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
  --txt:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --title:"Songti SC","STSong","Noto Serif CJK SC","Noto Serif SC","SimSun",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --page:#0B151E; --surface:#14232F; --sea:#0D1B27; --land:#1B2C3A; --coast:#3F5A6E; --border:#263A4A; --grat:#172938;
    --ink:#E7EEF2; --ink2:#A5B7C4; --ink3:#6F8595; --rule:#223646;
    --hot:#FF66B5; --cool:#5FA8F5; --danger:#FF8A80; --scrim:rgba(3,8,12,.6);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0B151E; --surface:#14232F; --sea:#0D1B27; --land:#1B2C3A; --coast:#3F5A6E; --border:#263A4A; --grat:#172938;
  --ink:#E7EEF2; --ink2:#A5B7C4; --ink3:#6F8595; --rule:#223646;
  --hot:#FF66B5; --cool:#5FA8F5; --danger:#FF8A80; --scrim:rgba(3,8,12,.6);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none !important}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--txt);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
h1,h2,p,ol,dl,dd{margin:0}
ol{padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--cool);outline-offset:2px}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "map" "side";max-width:1440px;margin:0 auto}
.top{grid-area:head;display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:16px 16px 12px}
.left{grid-area:map;min-width:0}
.side{grid-area:side;min-width:0;padding:4px 16px 40px}
h1{font-family:var(--title);font-weight:900;font-size:27px;line-height:1.15;letter-spacing:.04em}
.span{font-family:var(--num);font-weight:500;font-size:15px;color:var(--ink2);letter-spacing:.02em;margin-top:2px}
h2{font-family:var(--title);font-weight:700;font-size:18px;letter-spacing:.06em}

.btn{border:1px solid var(--ink);background:transparent;color:var(--ink);border-radius:3px;padding:8px 14px;font-weight:500;font-size:14px;line-height:1.2;white-space:nowrap;min-height:38px}
.btn.primary{background:var(--ink);color:var(--page)}
.btn.ghost{border-color:transparent;padding-inline:8px}
.btn.wide{width:100%;min-height:46px;font-size:15px}
.btn:disabled{opacity:.4;cursor:default}
.link{border:0;background:none;padding:6px 0;color:var(--cool);font-size:13px;font-weight:500;text-decoration:underline;text-underline-offset:3px}

/* ---------- map ---------- */
.map{position:relative;background:var(--sea);height:min(56vh,max(300px,88vw));overflow:hidden;border-block:1px solid var(--rule)}
.map svg{display:block;width:100%;height:100%;touch-action:none;cursor:grab;-webkit-user-select:none;user-select:none}
.map svg:active{cursor:grabbing}
.grat{fill:none;stroke:var(--grat);stroke-width:.5;vector-effect:non-scaling-stroke}
.land{fill:var(--land);stroke:var(--coast);stroke-width:.6;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.borders{fill:none;stroke:var(--border);stroke-width:.5;vector-effect:non-scaling-stroke}
.route{fill:none;stroke-linecap:round;stroke-width:1.15px;vector-effect:non-scaling-stroke;opacity:.88;transition:opacity .25s;pointer-events:none}
.route.ghost{stroke:var(--ink3);stroke-width:.6px;opacity:.28}
.route.dim{opacity:.1}
.hit{fill:none;stroke:transparent;stroke-width:16px;vector-effect:non-scaling-stroke;pointer-events:stroke;cursor:pointer}
.hit.fan{fill:transparent;pointer-events:all}
.arrow{pointer-events:none;transition:opacity .25s}
.arrow.off{display:none}
.arrow.dim{opacity:.1}
.tracer{fill:none;stroke:var(--hot);stroke-linecap:round;pointer-events:none}
.ap{cursor:pointer;transition:opacity .25s}
.ap circle{fill:var(--surface);stroke-width:1.6}
.ap .tap{fill:transparent;stroke:none}
.ap text{font:600 11.5px var(--num);fill:var(--ink);letter-spacing:.03em;paint-order:stroke;stroke:var(--land);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.ap.nolabel text{display:none}
.ap.ghost .dot{stroke:var(--ink3);opacity:.6}
.ap.dim{opacity:.18}
.chips{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 20px)}
.chip{border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:3px;padding:5px 10px;font-size:13px;line-height:1.2;min-height:30px}
.legend{position:absolute;left:12px;bottom:10px;display:flex;align-items:center;gap:8px;font:500 12px var(--num);color:var(--ink2);letter-spacing:.02em;pointer-events:none}
.legend i{display:block;width:54px;height:2px;border-radius:1px;background:linear-gradient(90deg,var(--cool),var(--hot))}
.focus{position:absolute;left:10px;right:10px;bottom:10px;background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--hot);border-radius:3px;padding:9px 10px 9px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.focus b{display:block;font-weight:600;font-size:15px;line-height:1.3}
.focus span{display:block;font-size:13px;color:var(--ink2)}
.playdate{position:absolute;right:12px;top:10px;text-align:right;pointer-events:none}
.playdate b{display:block;font:600 30px/1 var(--num);letter-spacing:.01em}
.playdate span{display:block;font-size:12px;color:var(--ink2);margin-top:3px}

/* ---------- timeline ---------- */
.tl{display:flex;align-items:flex-end;gap:12px;padding:12px 16px 0}
.play{display:inline-flex;align-items:center;gap:6px;flex:none}
.play svg{width:11px;height:11px;fill:currentColor}
.years{flex:1;min-width:0;display:flex;align-items:flex-end;gap:2px;height:62px}
.yr{flex:1 1 0;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;border:0;background:none;padding:0;color:var(--ink3);font:500 11.5px/1 var(--num)}
.yr i{display:block;width:100%;max-width:28px;min-height:2px;background:var(--ink3);border-radius:1px 1px 0 0;opacity:.6;transition:height .3s,background-color .2s,opacity .2s}
.yr.zero i{opacity:.25}
.yr.on{color:var(--ink)}
.yr.on i{background:var(--hot);opacity:1}
.tl-note{display:flex;align-items:center;gap:10px;min-height:32px;padding:4px 16px 0;font-size:13px;color:var(--ink2)}

/* ---------- side ---------- */
.notice{margin:10px 0 0;padding:10px 12px;border:1px solid var(--rule);border-left:3px solid var(--cool);background:var(--surface);border-radius:3px;font-size:14px}
.stats{padding:14px 0 18px;border-bottom:1px solid var(--rule)}
.big{display:grid;grid-template-columns:repeat(3,auto);justify-content:space-between;gap:8px}
.big div{min-width:0}
.big b{display:block;font:600 clamp(32px,10vw,48px)/1 var(--num);letter-spacing:-.005em;font-variant-numeric:tabular-nums}
.big span{display:block;font-size:13px;color:var(--ink2);margin-top:4px}
.equiv{margin-top:14px;font-size:14px;color:var(--ink2)}
.equiv p+p{margin-top:1px}
.equiv b{font:600 16.5px/1 var(--num);color:var(--ink);letter-spacing:.01em}
.moon{position:relative;height:30px;margin:8px 0 0;max-width:420px}
.moon .trk{position:absolute;left:5px;right:5px;top:5px;height:2px;background:var(--rule);border-radius:1px}
.moon .trk i{display:block;position:relative;height:100%;background:var(--hot);border-radius:1px}
.moon .trk i::after{content:"";position:absolute;right:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--hot)}
.moon .e,.moon .m{position:absolute;top:1px;width:10px;height:10px;border-radius:50%}
.moon .e{left:0;background:var(--cool)}
.moon .m{right:0;background:var(--page);border:1.5px solid var(--ink3)}
.moon span{position:absolute;top:15px;font-size:11.5px;line-height:1.2;color:var(--ink3)}
.moon .l{left:0}
.moon .r{right:0}
.facts{display:grid;grid-template-columns:auto 1fr;column-gap:14px;row-gap:3px;margin-top:10px;font-size:14px}
.facts dt{color:var(--ink2)}
.facts dd{font-weight:500}
.nw{white-space:nowrap}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:20px;margin-bottom:8px}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:3px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:13px;font-weight:500;min-height:32px;color:var(--ink)}
.seg button+button{border-left:1px solid var(--ink)}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--page)}
.rk{display:grid;grid-template-columns:1fr auto;align-items:baseline;column-gap:10px;padding:7px 0 0;width:100%;border:0;background:none;text-align:left}
.rk .lb{font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .lb small{font:500 12.5px var(--num);color:var(--ink3);margin-left:6px;letter-spacing:.03em}
.rk .ct{font:600 17px/1 var(--num);font-variant-numeric:tabular-nums}
.rk .tr{grid-column:1/-1;height:3px;background:var(--rule);margin-top:5px;border-radius:1px;overflow:hidden}
.rk .tr i{display:block;height:100%;background:var(--ink2)}
.rk.sel .tr i{background:var(--hot)}
.acts{display:flex;gap:16px}
.filter-note{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink2);padding-bottom:4px}
.yh{font:600 20px/1 var(--num);letter-spacing:.02em;padding:18px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.yh small{font:400 13px var(--txt);color:var(--ink2);letter-spacing:0}
.fl{display:grid;grid-template-columns:48px minmax(0,1fr) auto;column-gap:10px;padding:10px 0;border-top:1px solid var(--rule)}
.fl-date b{display:block;font:600 17px/1.2 var(--num);letter-spacing:.01em}
.fl-date span{display:block;font-size:12px;color:var(--ink3)}
.fl-codes{display:flex;align-items:center;gap:8px;font:600 17px/1.2 var(--num);letter-spacing:.04em}
.fl-codes svg{width:22px;height:8px;flex:none;stroke:var(--ink3);fill:none;stroke-width:1.2}
.fl-names{font-size:13.5px;line-height:1.35;margin-top:2px}
.fl-meta{display:flex;flex-wrap:wrap;column-gap:10px;font-size:12.5px;color:var(--ink2);margin-top:2px;align-items:baseline}
.fl-meta .fno{font:500 13.5px var(--num);letter-spacing:.03em;color:var(--ink)}
.fl-meta .tm{font:500 13.5px var(--num);letter-spacing:.02em}
.fl-num{text-align:right;white-space:nowrap}
.fl-num b{font:600 17px/1.2 var(--num);font-variant-numeric:tabular-nums}
.fl-num span{font-size:12px;color:var(--ink2);margin-left:3px}
.fl-num i{display:block;font-style:normal;font-size:12.5px;color:var(--ink2);margin-top:2px}
.del{border:1px solid var(--danger);background:none;border-radius:3px;padding:3px 9px;font-size:12.5px;color:var(--danger);margin-top:4px}
.del.sure{background:var(--danger);color:var(--page);font-weight:600}
.empty{padding:26px 0;color:var(--ink2);font-size:15px}
.foot{margin-top:26px;padding-top:12px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--ink3);max-width:46em}

/* ---------- import sheet ---------- */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet-scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet-panel{position:relative;width:100%;max-width:560px;max-height:100%;overflow:auto;background:var(--page);border-top:1px solid var(--rule);padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(20px + env(safe-area-inset-bottom,0px));min-height:100%}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sheet-head h2{font-size:22px}
.hint{font-size:13.5px;color:var(--ink2);margin:12px 0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 0}
.muted{font-size:13px;color:var(--ink2)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
textarea,.field input,.field select{width:100%;border:1px solid var(--ink3);border-radius:3px;background:var(--surface);padding:10px 11px;font-size:16px;line-height:1.35}
textarea{resize:vertical;min-height:92px;display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;margin-top:12px}
.field{position:relative;min-width:0}
.field.full{grid-column:1/-1}
#m-fno{text-transform:uppercase}
#m-fno::placeholder{text-transform:none}
.field label{display:block;font-size:13px;color:var(--ink2);margin-bottom:4px}
.sug{position:absolute;left:0;right:0;top:100%;z-index:3;background:var(--surface);border:1px solid var(--ink3);border-top:0;border-radius:0 0 3px 3px;max-height:220px;overflow:auto}
.sug button{display:flex;gap:10px;width:100%;border:0;background:none;text-align:left;padding:9px 11px;font-size:14.5px}
.sug button b{font:600 15px var(--num);letter-spacing:.04em;min-width:34px}
.sug button+button{border-top:1px solid var(--rule)}
.err{color:var(--danger);font-size:13.5px;min-height:20px;margin-top:8px}
.cand{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:10px;padding:10px 0;border-top:1px solid var(--rule);align-items:start}
.cand input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--hot)}
.cand b{font:600 16px/1.3 var(--num);letter-spacing:.03em}
.cand p{font-size:13.5px;color:var(--ink2)}
.cand .tag{font-size:12.5px;font-weight:600;color:var(--ink2)}
.cand .tag.bad{color:var(--danger)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--page);padding:10px 16px;border-radius:3px;font-size:14px;max-width:calc(100% - 32px)}

@media (min-width:980px){
  .layout{grid-template-columns:minmax(0,1fr) 440px;grid-template-areas:"map head" "map side";grid-template-rows:auto 1fr}
  .left{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-self:start;border-right:1px solid var(--rule)}
  .map{flex:1;height:auto;border-top:0}
  .tl{padding-inline:24px}
  .tl-note{padding:4px 24px 10px}
  .top{padding:26px 28px 6px}
  .side{padding:4px 28px 56px}
  h1{font-size:32px}
  .big b{font-size:50px}
  .sheet{align-items:center}
  .sheet-panel{min-height:0;max-height:90vh;border:1px solid var(--rule);border-radius:4px;padding:20px 22px 22px}
}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>
</head>
<body>
<div class="layout">
  <header class="top">
    <div>
      <h1>我的飞行图</h1>
      <p class="span" id="span">正在读取飞行记录…</p>
    </div>
    <button class="btn primary" id="btn-import" hidden>导入航班</button>
  </header>

  <section class="left" aria-label="航线地图">
    <div class="map" id="map">
      <svg id="mapsvg" role="img" aria-label="飞行航线世界地图"></svg>
      <div class="chips" id="chips"></div>
      <div class="legend" id="legend" hidden><span id="lg-min"></span><i></i><span id="lg-max"></span></div>
      <div class="playdate" id="playdate" hidden><b></b><span></span></div>
      <div class="focus" id="focus" hidden></div>
    </div>
    <div class="tl">
      <button class="btn play" id="btn-play" disabled aria-label="按时间顺序回放全部航班"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1 0l9 5-9 5z"/></svg><span>回放</span></button>
      <div class="years" id="years" role="group" aria-label="按年份筛选"></div>
    </div>
    <p class="tl-note" id="tl-note"></p>
  </section>

  <main class="side">
    <p class="notice" id="notice" hidden></p>
    <section class="stats" aria-label="累计数据">
      <div class="big">
        <div><b id="s-n">–</b><span>次飞行</span></div>
        <div><b id="s-h">–</b><span>小时</span></div>
        <div><b id="s-km">–</b><span>公里</span></div>
      </div>
      <div class="equiv" id="s-eq"></div>
      <dl class="facts" id="s-facts"></dl>
    </section>
    <section>
      <div class="sec-head">
        <h2>排行</h2>
        <div class="seg" role="tablist" id="rank-tabs">
          <button role="tab" aria-selected="true" data-tab="route">航线</button>
          <button role="tab" aria-selected="false" data-tab="ap">机场</button>
          <button role="tab" aria-selected="false" data-tab="airline">航司</button>
        </div>
      </div>
      <ol id="rank-list"></ol>
      <button class="link" id="rank-more" hidden></button>
    </section>
    <section>
      <div class="sec-head">
        <h2>飞行记录</h2>
        <span class="acts"><button class="link" id="btn-edit" hidden>删除记录</button><button class="link" id="btn-json" hidden>导出备份</button><button class="link" id="btn-csv" hidden>导出 CSV</button></span>
      </div>
      <p class="filter-note" id="log-filter" hidden></p>
      <div id="log-list"></div>
    </section>
    <p class="foot" id="foot-backup"></p>
    <p class="foot" style="border-top:0;margin-top:8px;padding-top:0">时长按起降时刻和两地时区推算，里程按两个机场之间的大圆距离计算，所以和航旅类 App 里的累计数字会有一点出入。</p>
  </main>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-scrim" id="sheet-scrim"></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <h2 id="sheet-title">导入航班</h2>
      <button class="btn ghost" id="sheet-close">关闭</button>
    </div>
    <div class="seg" role="tablist" id="imp-tabs">
      <button role="tab" aria-selected="true" data-tab="manual">手动填写</button>
      <button role="tab" aria-selected="false" data-tab="file">导入文件或 JSON</button>
    </div>

    <div id="pane-file" hidden>
      <p class="hint">选之前导出的备份文件（JSON 或 CSV）。想从截图导入，可以把截图和下面的提示词一起发给任意一个 AI 助手，再把它回复的 JSON 粘贴到这里。</p>
      <div class="row">
        <label class="btn" for="imp-files">选择备份文件</label>
        <input class="vh" type="file" id="imp-files" accept=".json,.csv,application/json,text/csv,text/plain">
        <button class="btn" id="imp-copy">复制识别提示词</button>
      </div>
      <p class="muted" id="imp-files-note"></p>
      <textarea id="imp-text" aria-label="航班 JSON" spellcheck="false" placeholder='或者粘贴 JSON，例如 [{"date":"2026-06-20","fno":"NH964","dep":"PEK","arr":"HND","depT":"08:20","arrT":"12:55"}]'></textarea>
      <div class="row">
        <button class="btn primary" id="imp-run">读取</button>
        <span class="muted" id="imp-status" role="status"></span>
      </div>
      <div id="imp-results"></div>
      <button class="btn primary wide" id="imp-add" hidden></button>
    </div>

    <div id="pane-manual">
      <div class="grid2">
        <div class="field"><label for="m-date">出发日期</label><input type="date" id="m-date"></div>
        <div class="field"><label for="m-fno">航班号</label><input id="m-fno" placeholder="CA1234" autocapitalize="characters" autocomplete="off" spellcheck="false"></div>
        <div class="field full"><label for="m-airline">航空公司</label><input id="m-airline" placeholder="按航班号自动填写，可以改" autocomplete="off"></div>
        <div class="field full"><label for="m-dep">出发机场</label><input id="m-dep" placeholder="三字码或城市，例如 PEK、厦门" autocomplete="off" spellcheck="false"><div class="sug" id="m-dep-sug" hidden></div></div>
        <div class="field full"><label for="m-arr">到达机场</label><input id="m-arr" placeholder="三字码或城市，例如 DFW、东京" autocomplete="off" spellcheck="false"><div class="sug" id="m-arr-sug" hidden></div></div>
        <div class="field"><label for="m-dept">起飞时间（当地）</label><input type="time" id="m-dept"></div>
        <div class="field"><label for="m-arrt">到达时间（当地）</label><input type="time" id="m-arrt"></div>
        <div class="field full"><label for="m-plus">到达日期</label><select id="m-plus"><option value="0">出发当天</option><option value="1">第二天</option><option value="2">第三天</option></select></div>
      </div>
      <p class="err" id="m-err" role="alert"></p>
      <button class="btn primary wide" id="m-add">加入这条航班</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>// https://d3js.org v7.8.5 Copyright 2010-2023 Mike Bostock

  row.push(cur); if(row.some(function(x){ return x!==''; })) rows.push(row);
  if(rows.length<2) return [];
  var H={'日期':'date','出发日期':'date','date':'date','航班号':'fno','fno':'fno','航空公司':'airline','airline':'airline','出发机场代码':'dep','dep':'dep','出发机场':'depName','depName':'depName','出发航站楼':'depTerm','depTerm':'depTerm','起飞时间':'depT','出发时间':'depT','depT':'depT',
    '到达机场代码':'arr','arr':'arr','到达机场':'arrName','arrName':'arrName','到达航站楼':'arrTerm','arrTerm':'arrTerm','到达时间':'arrT','arrT':'arrT','到达跨天':'plus','plus':'plus'};
  var keys=rows[0].map(function(h){ return H[h.trim()]||null; });
  return rows.slice(1).map(function(r){ var o={}; keys.forEach(function(k,j){ if(k) o[k]=r[j]; }); return o; });
}
function parseImport(text){
  text=String(text||'').trim(); if(!text) return [];
  var first=text.replace(/^\ufeff/,'')[0];
  if(first!=='['&&first!=='{'&&/^[^\n]*(日期|date)[^\n]*,/.test(text.replace(/^\ufeff/,''))) return parseCSV(text);
  var v=null; try{ v=JSON.parse(text); }catch(e){ var a=text.indexOf('['),b=text.lastIndexOf(']'); if(a>=0&&b>a){ try{ v=JSON.parse(text.slice(a,b+1)); }catch(e2){} } }
  if(v&&!Array.isArray(v)&&Array.isArray(v.flights)) v=v.flights;
  if(!Array.isArray(v)) throw new Error('format');
  return v;
}
function runImport(){
  var file=($('#imp-files').files||[])[0],text=$('#imp-text').value,st=$('#imp-status');
  var go=function(t){
    try{ var arr=parseImport(t),seen=new Set();
      cands=arr.map(normItem).filter(function(c){ if(!c) return false; var k=flightId(c); if(seen.has(k)) return false; seen.add(k); return true; });
      cands.sort(function(a,b){ return a.date<b.date?1:a.date>b.date?-1:0; });
      st.textContent=cands.length?'读出 '+cands.length+' 条，确认后加入。':'没有读到航班。'; renderCands();
    }catch(e){ cands=[]; renderCands(); st.textContent='看不懂这份内容。需要本页面导出的备份文件，或者一段航班 JSON。'; }
  };
  if(file){ var fr=new FileReader(); fr.onload=function(){ go(String(fr.result||'')); }; fr.onerror=function(){ st.textContent='这个文件读不了。'; }; fr.readAsText(file); }
  else if(text.trim()) go(text);
  else st.textContent='先选一个备份文件，或者粘贴一段 JSON。';
}
function addPicked(){
  var items=cands.filter(function(c){ return c.pick&&!c.problem; }),b=$('#imp-add'); if(!items.length) return;
  b.disabled=true; b.textContent='正在加入…';
  saveFlights(items,'import').then(function(n){ toast('已加入 '+n+' 条航班'); cands=[]; renderCands(); $('#imp-status').textContent=''; $('#imp-text').value=''; $('#imp-files').value=''; $('#imp-files-note').textContent=''; closeSheet(); },
    function(e){ toast(e.done?'只加入了 '+e.done+' 条，其余没写进去，请再试一次。':'没能写入，请稍后再试。'); updateAdd(); });
}
/* manual form */
function apLabel(id){ var z=ZH.get(id),a=AP.get(id); return z?z.city+z.short:(a?a.city+(a.name&&a.name!==a.city?' '+a.name:''):id); }
function searchAP(q){
  q=q.trim(); if(!q) return []; var Q=q.toUpperCase(),out=[],seen=new Set(),push=function(id){ if(!seen.has(id)&&AP.has(id)&&out.length<8){ seen.add(id); out.push(id); } };
  if(AP.has(Q)) push(Q);
  ZH.forEach(function(z,id){ if((z.city+z.short).indexOf(q)>=0) push(id); });
  if(/^[A-Za-z .'-]+$/.test(q)){
    var ql=q.toLowerCase();
    if(q.length>=2) AP.forEach(function(a,id){ if(a.city.toLowerCase().indexOf(ql)===0) push(id); });
    if(Q.length<3) AP.forEach(function(a,id){ if(id.indexOf(Q)===0) push(id); });
  }
  return out;
}
function bindAP(inputId){
  var inp=$('#'+inputId),sug=$('#'+inputId+'-sug');
  var choose=function(id){ inp.value=id+'  '+apLabel(id); inp.dataset.iata=id; sug.hidden=true; };
  inp.addEventListener('input',function(){
    delete inp.dataset.iata; var res=searchAP(inp.value); sug.textContent='';
    res.forEach(function(id){ sug.append(el('button',{type:'button',onmousedown:function(e){ e.preventDefault(); },onclick:function(){ choose(id); }},el('b',{text:id}),apLabel(id))); });
    sug.hidden=!res.length;
  });
  inp.addEventListener('blur',function(){ setTimeout(function(){ sug.hidden=true; },150); var q=inp.value.trim().toUpperCase(); if(!inp.dataset.iata&&AP.has(q)) choose(q); });
}
function addManual(){
  var err=$('#m-err'),v=function(id){ return $('#'+id).value.trim(); };
  var f=normItem({date:v('m-date'),fno:v('m-fno'),airline:v('m-airline'),dep:$('#m-dep').dataset.iata||'',arr:$('#m-arr').dataset.iata||'',depT:v('m-dept'),arrT:v('m-arrt'),plus:v('m-plus')});
  var msg=!v('m-date')?'请选出发日期。':!f.fno?'请填航班号。':!$('#m-dep').dataset.iata?'请从列表里选出发机场。':!$('#m-arr').dataset.iata?'请从列表里选到达机场。':f.problem?f.problem+'。':'';
  err.textContent=msg; if(msg) return;
  f.depName=apDefaultName(f.dep); f.arrName=apDefaultName(f.arr);
  var b=$('#m-add'); b.disabled=true;
  saveFlights([f],'manual').then(function(){ toast('已加入 '+f.date+' '+f.fno); ['m-fno','m-airline','m-dep','m-arr','m-dept','m-arrt'].forEach(function(id){ var x=$('#'+id); x.value=''; delete x.dataset.iata; }); $('#m-plus').value='0'; closeSheet(); },
    function(){ err.textContent='没能写入，请稍后再试。'; }).then(function(){ b.disabled=false; });
}
function exportCSV(){
  var q=function(s){ s=String(s==null?'':s); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  var rows=[['日期','航班号','航空公司','出发机场代码','出发机场','出发航站楼','起飞时间','到达机场代码','到达机场','到达航站楼','到达时间','到达跨天','里程公里','时长分钟']];
  S.flights.forEach(function(f){ rows.push([f.date,f.fno,f.airline,f.dep,f.depName||apDefaultName(f.dep),f.depTerm,f.depT,f.arr,f.arrName||apDefaultName(f.arr),f.arrTerm,f.arrT,f.plus,Math.round(f.km),f.min]); });
  saveFile('我的飞行记录.csv','\ufeff'+rows.map(function(r){ return r.map(q).join(','); }).join('\r\n'),'text/csv').then(function(ok){ if(ok) toast('已导出 '+S.flights.length+' 条'); },function(){ toast('没能导出，请稍后再试。'); });
}

function exportJSON(){
  var day=new Date().toISOString().slice(0,10);
  var body={app:'flight-map',version:1,exported:new Date().toISOString(),flights:S.flights.map(function(f){ return {date:f.date,fno:f.fno,airline:f.airline,dep:f.dep,depName:f.depName,depTerm:f.depTerm,depT:f.depT,arr:f.arr,arrName:f.arrName,arrTerm:f.arrTerm,arrT:f.arrT,plus:f.plus}; })};
  saveFile('飞行记录备份_'+day+'.json',JSON.stringify(body,null,1),'application/json').then(function(ok){ if(!ok) return; lsSet(KEY_BK,new Date().toISOString()); lsSet(KEY_DIRTY,null); renderBackupNote(); toast('已导出 '+S.flights.length+' 条备份'); },function(){ toast('没能导出，请稍后再试。'); });
}
/* ---------- wiring ---------- */
$('#btn-play').addEventListener('click',startPlay);
$('#rank-tabs').addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b) return; S.rankTab=b.dataset.tab; S.rankAll=false;
  Array.prototype.forEach.call(this.children,function(x){ x.setAttribute('aria-selected',x===b?'true':'false'); }); renderRank(); });
$('#rank-more').addEventListener('click',function(){ S.rankAll=!S.rankAll; renderRank(); });
$('#btn-import').addEventListener('click',openSheet);
$('#sheet-close').addEventListener('click',closeSheet);
$('#sheet-scrim').addEventListener('click',closeSheet);
document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&!$('#sheet').hidden) closeSheet(); });
$('#imp-tabs').addEventListener('click',function(e){ var b=e.target.closest('button'); if(b) setTab(b.dataset.tab); });
$('#imp-files').addEventListener('change',function(){ var f=this.files[0]; $('#imp-files-note').textContent=f?'已选 '+f.name:''; if(f) runImport(); });
$('#imp-copy').addEventListener('click',copyPrompt);
$('#btn-json').addEventListener('click',exportJSON);
$('#imp-run').addEventListener('click',runImport);
$('#imp-add').addEventListener('click',addPicked);
$('#m-fno').addEventListener('input',function(){ var a=airlineOf(this.value.toUpperCase().replace(/[^A-Z0-9]/g,'')),x=$('#m-airline'); if(a&&(!x.value||x.dataset.auto)){ x.value=a; x.dataset.auto='1'; } });
$('#m-airline').addEventListener('input',function(){ delete this.dataset.auto; });
$('#m-add').addEventListener('click',addManual);
$('#btn-csv').addEventListener('click',exportCSV);
$('#btn-edit').addEventListener('click',function(){ S.editing=!S.editing; this.textContent=S.editing?'完成':'删除记录'; renderLog(); });
bindAP('m-dep'); bindAP('m-arr');

readColors(); layoutMap(); recompute(); renderAll();
var rz=0; new ResizeObserver(function(){ clearTimeout(rz); rz=setTimeout(function(){ var r=$('#map').getBoundingClientRect(); if(Math.abs(r.width-W)<2&&Math.abs(r.height-H)<2) return; layoutMap(); renderMap(); if(VIEW&&VIEW.n) fitTo(Array.from(VIEW.aps.keys()),false); },150); }).observe($('#map'));
var themeChanged=function(){ readColors(); renderMap(); };
if(window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change',themeChanged);
new MutationObserver(themeChanged).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

/* ---------- data ---------- */
function onFlights(docs){
  var list=[]; docs.forEach(function(d){ var f=d.exists===false?null:enrich(d.id,d.data()||{}); if(f) list.push(f); });
  list.sort(function(a,b){ return a.ts-b.ts||(a.id<b.id?-1:1); });
  if(S.play){ clearTimeout(S.play.timer); S.play=null; gTr.selectAll('*').remove(); $('#playdate').hidden=true; }
  S.flights=list; S.loaded=true; buildArcs();
  if(S.year&&!list.some(function(f){ return f.year===S.year; })) S.year=null;
  recompute(); renderAll();
  if(!S.fitted&&list.length){ S.fitted=true; fitTo(Array.from(ALL.aps.keys()),false); }
}
function start(){
  db=localDB(); S.owner=true; $('#btn-import').hidden=false;
  if(!db.ok) notice('这个浏览器现在不允许网页保存数据（比如无痕模式，或者在聊天应用的预览里打开）。可以照常查看和导入，但关掉页面后记录不会留下。');
  db.collection('flights').onSnapshot(function(snap){ onFlights(snap.docs); });
}
start();
})();
